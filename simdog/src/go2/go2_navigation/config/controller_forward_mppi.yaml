# Go2 默认前向 DiffDrive MPPI 控制档。
#
# 每个控制周期采样 800 条候选轨迹并按各 critic 加权选优；前向限定
# vx∈[0,0.27]、vy=0。采样规模按当前 10 Hz 控制频率限制，常态关闭轨迹
# 可视化。需要 RPP 对照时显式传 controller_profile:=forward_rpp。
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.10
      batch_size: 800
      vx_std: 0.10
      vy_std: 0.0
      wz_std: 0.20
      vx_max: 0.27
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.40
      motion_model: "DiffDrive"
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      # 默认关闭 MPPI 轨迹云，避免与双 LaserScan A/B 显示争抢 RViz/Gazebo 资源。
      visualize: false
      transform_tolerance: 0.2
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic",
                "ObstaclesCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.5
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.10
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

velocity_smoother:
  ros__parameters:
    # 这是 Nav2、键盘与 Unitree Move 共用的最终速度窗，不能用 MPPI 的
    # “只向前采样”约束封死手动倒车。自主导航仍由上面的 vx_min=0.0、
    # vx_max=0.27 和 wz_max=0.40 保持前向；手动链在 CHAMP 已配置的
    # 0.30 m/s、0.50 rad/s 边界内允许对称正反运动。
    max_velocity: [0.30, 0.0, 0.50]
    min_velocity: [-0.30, 0.0, -0.50]
