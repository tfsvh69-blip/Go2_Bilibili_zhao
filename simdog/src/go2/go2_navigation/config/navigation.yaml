# Go2 自主导航 Nav2 参数（阶段一：室内平地闭环）
#
# 相对旧 go2_config/config/autonomy/navigation.yaml 的修正：
# - odom_topic 改为 /odom（不再依赖 LIO-SAM 内部话题）；
# - footprint 使用 URDF collision 与实际步态联合标定的凸多边形；
# - 全部节点 use_sim_time: True，与 Gazebo 时钟一致；
# - 规划器使用 SmacPlanner2D，控制器由 controller_profile 参数文件提供；
# - Velodyne 水平切片统一转换为 /scan，D435 使用实际话题 /depth/color/points；
# - 提供稳定普通（0.30/0.10）与精确（0.10/0.10）两档 goal checker；
# - 参数名以本机 ROS 2 Humble Nav2 运行时声明为准，禁止混用新发行版字段。

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker", "precise_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      # 四足的原地转向也是有效进展，不应只用平移距离判定卡住。
      required_movement_radius: 0.10
      required_movement_angle: 0.15
      movement_time_allowance: 15.0

    # 普通模式：约 5.7° 航向精度。该值由 0.15 rad 单步收紧，
    # 若四足落足漂移导致终点反复修正，应先处理步态/定位而不再收紧。
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.10

    # 精确模式：0.10 m / 0.10 rad
    precise_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10

    # FollowPath 的具体插件和参数由 controller_profile 参数文件
    # （controller_forward_mppi.yaml / controller_forward_rpp.yaml /
    # controller_omni_mppi.yaml）提供，避免各档插件参数互相污染。

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      w_data: 0.2
      w_smooth: 0.3
      do_refinement: True
      refinement_num: 2
      enforce_path_inversion: False

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      # 不允许规划器用附近替代终点静默完成；目标门禁会提前拒绝明显非法目标。
      tolerance: 0.0
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000
      smooth_path: true
      # SmacPlanner2D 在 false 时强制保留 RViz 目标的最终 yaw。
      use_final_approach_orientation: false
      minimum_turning_radius: 0.0  # SmacPlanner2D 忽略，仅占位
      cost_travel_multiplier: 2.0

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    # Gazebo/CHAMP 联调时 10 ms 循环会制造大量重复反馈，20 ms 应答门槛也会
    # 把正常调度抖动误报为 action/service 超时。20 Hz 足以驱动导航树。
    bt_loop_duration: 50
    default_server_timeout: 500
    enable_groot_monitoring: False
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - go2_terminal_path_latch_bt_node

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# 速度平滑：订阅 twist_mux 输出，输出到 collision_monitor。
# 输入输出话题经 launch remap 接入控制链。
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.15, 0.35]
    min_velocity: [-0.20, -0.15, -0.35]
    max_accel: [0.8, 0.8, 1.5]
    max_decel: [-0.8, -0.8, -1.5]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# 碰撞监控：减速区 + 急停区，传感器过期时停止。
collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    transform_tolerance: 0.5
    # 最终 16x900 完整运动为 8.89 Hz；2 s 仍是有记录的宽松联调值，
    # 待更长压力/失效注入后再按 p99 与安全停车需求单变量收紧。
    source_timeout: 2.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # 减速区：机身外 0.45 m；急停区：机身外 0.12 m
    polygons: ["footprint", "decel_zone", "stop_zone"]
    footprint:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.1
      max_points: 5
      visualize: False
      enabled: True
    decel_zone:
      type: "polygon"
      points: [0.72, 0.45, 0.72, -0.45, -0.55, -0.45, -0.55, 0.45]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.3
      visualize: True
      polygon_pub_topic: "polygon_decel"
      enabled: True
    stop_zone:
      type: "polygon"
      points: [0.52, 0.33, 0.52, -0.33, -0.34, -0.33, -0.34, 0.33]
      action_type: "stop"
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
    observation_sources: ["scan", "d435"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True
    d435:
      type: "pointcloud"
      topic: "/depth/color/points"
      min_height: 0.05
      max_height: 1.50
      enabled: True

# 全局代价地图：静态地图 + Velodyne 障碍层 + 膨胀层
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      # Humble 的 ObstacleLayer 将此值同时作为 MessageFilter 等待上限；
      # 0.50 s 可覆盖重载 gpu_ray 的相邻帧间隔，仍不保留旧障碍观测。
      transform_tolerance: 0.50
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        subscribe_to_updates: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          # Humble 的 observation source 默认 max_obstacle_height=0.0，
          # 不会继承外层 ObstacleLayer 的 2.0；必须覆盖才能接收高于地面的雷达端点。
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          obstacle_min_range: 0.0
          # go2_lidar_scan 用 +inf 表示无回波。Humble 会将其变为
          # scan.range_max-0.0001=14.9999 m；标记上限必须严格更小，避免把
          # 清除端点重新标成幽灵障碍。
          inf_is_valid: True
          obstacle_max_range: 14.0
          raytrace_min_range: 0.0
          raytrace_max_range: 15.0
          marking: True
          clearing: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 现场确认雷达高度窗 0.20..0.30 m 后，Global Costmap 已基本不再产生
        # 幽灵代价岛。0.50 m 半径让全局路径更早远离墙面和障碍；较低的
        # 0.5 衰减系数让代价在半径内缓慢下降。它不改变 /scan 端点，也不
        # 影响下方 Local Costmap 的近场参数。
        cost_scaling_factor: 0.5
        inflation_radius: 0.50
      footprint: "[[-0.399,-0.156],[-0.393,-0.163],[-0.373,-0.175],[-0.353,-0.18],[-0.162,-0.202],[0.231,-0.178],[0.238,-0.176],[0.24,-0.175],[0.247,-0.17],[0.354,-0.046],[0.354,0.045],[0.35,0.058],[0.245,0.173],[0.244,0.174],[0.24,0.177],[0.21,0.188],[0.205,0.189],[-0.169,0.194],[-0.174,0.194],[-0.361,0.174],[-0.38,0.169],[-0.397,0.157],[-0.398,0.156],[-0.399,0.154]]"
      footprint_padding: 0.035
      always_send_full_costmap: False
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

# 局部代价地图：5×5 m、0.05 m，Velodyne 体素层 + D435 近场层 + 膨胀层
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.50
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      plugins: ["scan_layer", "d435_layer", "inflation_layer"]
      scan_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          # /scan 端点转换到 odom 后位于雷达实际高度；显式覆盖 source 级
          # 0.0 m 默认值，否则局部代价图会保持全空闲。
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          obstacle_min_range: 0.0
          inf_is_valid: True
          obstacle_max_range: 14.0
          raytrace_min_range: 0.0
          raytrace_max_range: 15.0
          marking: True
          clearing: True
      d435_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: d435
        d435:
          topic: /depth/color/points
          data_type: "PointCloud2"
          max_obstacle_height: 1.50
          min_obstacle_height: 0.05
          observation_persistence: 0.0
          expected_update_rate: 0.0
          obstacle_min_range: 0.0
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          marking: True
          clearing: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 阶段 2 只校准 footprint；此值留待阶段 3 单变量实测。
        inflation_radius: 0.30
      footprint: "[[-0.399,-0.156],[-0.393,-0.163],[-0.373,-0.175],[-0.353,-0.18],[-0.162,-0.202],[0.231,-0.178],[0.238,-0.176],[0.24,-0.175],[0.247,-0.17],[0.354,-0.046],[0.354,0.045],[0.35,0.058],[0.245,0.173],[0.244,0.174],[0.24,0.177],[0.21,0.188],[0.205,0.189],[-0.169,0.194],[-0.174,0.194],[-0.361,0.174],[-0.38,0.169],[-0.397,0.157],[-0.398,0.156],[-0.399,0.154]]"
      footprint_padding: 0.035
      always_send_full_costmap: False
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names: ["controller_server", "smoother_server", "planner_server",
                 "behavior_server", "bt_navigator", "waypoint_follower",
                 "velocity_smoother", "collision_monitor"]
    bond_timeout: 10.0
