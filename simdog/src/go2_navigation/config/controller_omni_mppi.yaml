# Go2 全向 MPPI 对照档。保留原有的横移能力，用于与默认 MPPI 档做实验对比。
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1500
      vx_std: 0.10
      vy_std: 0.10
      wz_std: 0.20
      vx_max: 0.20
      vx_min: -0.20
      vy_max: 0.15
      wz_max: 0.35
      motion_model: "Omni"
      temperature: 0.3
      gamma: 0.015
      visualize: false
      transform_tolerance: 0.1
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic",
                "ObstaclesCritic", "PathAlignCritic", "PathFollowCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 0.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.5
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.10
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 0.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.5
        distance_weight: 1.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.20, 0.15, 0.35]
    min_velocity: [-0.20, -0.15, -0.35]
