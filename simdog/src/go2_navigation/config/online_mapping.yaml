# Go2 在线二维建图参数。
#
# Velodyne 点云先取传感器水平附近的窄切片生成 LaserScan，减少地面点
# 被投影为伪障碍。slam_toolbox 在此模式下唯一发布 map -> odom。
pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: true
    # 输入点云本身已是 velodyne；留空走直接订阅，避免 MessageFilter 在冷启动
    # 等待“velodyne -> velodyne”恒等 TF 时把首批点云长期积压。
    target_frame: ""
    transform_tolerance: 0.05
    # 导航安全链长期需要 /scan；避免订阅图变化触发 lazy 订阅竞态后断流。
    always_subscribe: true
    min_height: -0.05
    # 建图/导航共用切片：上界 0.10m 对矮障碍（my.world 里 0.42m 高的 Wood 墙，
    # 墙顶相对 velodyne 仅 +0.094m）只有 6mm 余量，VLP-16 垂直环量化抖动会让墙顶
    # 在切片边缘反复丢，导致静态地图记不住墙，导航时被当成“幽灵障碍”。
    # 提到 0.15m（绝对上界 0.473m）给墙顶留 56mm 余量；0.9m 内本体点仍在 range_min
    # 盲区，不会引入腿点。详见 docs/costmap_ghost_obstacle_investigation.md。
    max_height: 0.15
    # 保持最大角略小于完整 pi 端点：转换器分配 720 个 bin，恰好为 pi
    # 的点若计算出索引 720 会越界。
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.00872665
    scan_time: 0.10
    range_min: 0.90
    range_max: 15.0
    # 无回波方向输出 range_max(15.0m) 而非 +inf。costmap 的 LaserScan source 未设
    # inf_is_valid(Nav2 1.1.20 默认 false)，+inf 不参与 raytrace clearing，会使旧
    # lethal 格残留成“幽灵障碍”，直到某条有限射线偶然穿过才消失（表现为靠近才消失）。
    # 改 false 后无回波=15.0m 端点：它等于 obstacle/raytrace max range(15.0)，marking
    # 用严格小于判断不会误标为障碍，但会被 raytrace 正常清除空射线。AMCL/slam_toolbox
    # 都把 max-range beam 当作 z_max 低权重处理，+inf 与 15.0m 等价，对定位无影响。
    # 详见 docs/costmap_ghost_obstacle_investigation.md。
    use_inf: false
    inf_epsilon: 1.0

slam_toolbox:
  ros__parameters:
    use_sim_time: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    use_map_saver: true
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.9
    max_laser_range: 15.0
    minimum_time_interval: 0.10
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    check_min_dist_and_heading_precisely: true
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 15.0
    link_match_minimum_response_fine: 0.10
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
