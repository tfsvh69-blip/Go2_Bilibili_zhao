# Go2 自主导航 Nav2 参数（阶段一：室内平地闭环）
#
# 相对旧 go2_config/config/autonomy/navigation.yaml 的修正：
# - odom_topic 改为 /odom（不再依赖 LIO-SAM 内部话题）；
# - footprint 使用机身多边形而非 robot_radius=0.22；
# - 全部节点 use_sim_time: True，与 Gazebo 时钟一致；
# - 规划器使用 SmacPlanner2D，控制器由 controller_profile 参数文件提供；
# - Velodyne 水平切片统一转换为 /scan，D435 使用实际话题 /depth/color/points；
# - 提供稳定普通（0.30/0.25）与精确（0.10/0.10）两档 goal checker；
# - 参数名以本机 ROS 2 Humble Nav2 运行时声明为准，禁止混用新发行版字段。

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker", "precise_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      # 四足的原地转向也是有效进展，不应只用平移距离判定卡住。
      required_movement_radius: 0.10
      required_movement_angle: 0.15
      movement_time_allowance: 15.0

    # 普通模式：稳定完成优先，给四足落足与定位波动留出滞回余量。
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.25

    # 精确模式：0.10 m / 0.10 rad
    precise_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10

    # FollowPath 的具体插件和参数由 controller_forward_rpp.yaml 或
    # controller_omni_mppi.yaml 提供，避免两套插件参数互相污染。

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      w_data: 0.2
      w_smooth: 0.3
      do_refinement: True
      refinement_num: 2
      enforce_path_inversion: False

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000
      smooth_path: true
      minimum_turning_radius: 0.0  # SmacPlanner2D 忽略，仅占位
      cost_travel_multiplier: 2.0

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    # Gazebo/CHAMP 联调时 10 ms 循环会制造大量重复反馈，20 ms 应答门槛也会
    # 把正常调度抖动误报为 action/service 超时。20 Hz 足以驱动导航树。
    bt_loop_duration: 50
    default_server_timeout: 500
    enable_groot_monitoring: False
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# 速度平滑：订阅 twist_mux 输出，输出到 collision_monitor。
# 输入输出话题经 launch remap 接入控制链。
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.15, 0.35]
    min_velocity: [-0.20, -0.15, -0.35]
    max_accel: [0.8, 0.8, 1.5]
    max_decel: [-0.8, -0.8, -1.5]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# 碰撞监控：减速区 + 急停区，传感器过期时停止。
collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    transform_tolerance: 0.5
    # 16x1800 gpu_ray 在 Gazebo 高负载窗口实测最长约 1.5 s 才到下一帧；
    # 2 s 是有记录的联调值，闭环稳定后再按传感器实测收紧。
    source_timeout: 2.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # 减速区：机身外 0.45 m；急停区：机身外 0.12 m
    polygons: ["footprint", "decel_zone", "stop_zone"]
    footprint:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.1
      max_points: 5
      visualize: False
      enabled: True
    decel_zone:
      type: "polygon"
      points: [0.72, 0.45, 0.72, -0.45, -0.55, -0.45, -0.55, 0.45]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.3
      visualize: True
      polygon_pub_topic: "polygon_decel"
      enabled: True
    stop_zone:
      type: "polygon"
      points: [0.52, 0.33, 0.52, -0.33, -0.34, -0.33, -0.34, 0.33]
      action_type: "stop"
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
    observation_sources: ["scan", "d435"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True
    d435:
      type: "pointcloud"
      topic: "/depth/color/points"
      min_height: 0.05
      max_height: 1.50
      enabled: True

# 全局代价地图：静态地图 + Velodyne 障碍层 + 膨胀层
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        subscribe_to_updates: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          obstacle_max_range: 15.0
          raytrace_max_range: 15.0
          marking: True
          clearing: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 阶段一先用紧贴 footprint 的联调值；闭环稳定后按场景逐步增大。
        inflation_radius: 0.30
      footprint: "[[0.42, 0.24], [0.42, -0.24], [-0.28, -0.24], [-0.28, 0.24]]"
      always_send_full_costmap: False
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

# 局部代价地图：5×5 m、0.05 m，Velodyne 体素层 + D435 近场层 + 膨胀层
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      plugins: ["scan_layer", "d435_layer", "inflation_layer"]
      scan_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          obstacle_max_range: 15.0
          raytrace_max_range: 15.0
          marking: True
          clearing: True
      d435_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: d435
        d435:
          topic: /depth/color/points
          data_type: "PointCloud2"
          max_obstacle_height: 1.50
          min_obstacle_height: 0.05
          marking: True
          clearing: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
      footprint: "[[0.42, 0.24], [0.42, -0.24], [-0.28, -0.24], [-0.28, 0.24]]"
      always_send_full_costmap: False
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names: ["controller_server", "smoother_server", "planner_server",
                 "behavior_server", "bt_navigator", "waypoint_follower",
                 "velocity_smoother", "collision_monitor"]
    bond_timeout: 10.0
