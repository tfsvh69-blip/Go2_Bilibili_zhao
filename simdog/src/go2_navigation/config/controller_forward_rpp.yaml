# Go2 默认前向控制档。
#
# Regulated Pure Pursuit 只输出前向线速度和角速度，使四足机器人的
# 行为更接近“先对齐路径、再向前跟随”。参数名以 Nav2 Humble 1.1.20
# 的运行时声明为准。
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.27
      lookahead_dist: 0.55
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.80
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.35
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.50
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.25
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      regulated_linear_scaling_min_radius: 0.40
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: true
      # 普通弯道交给 RPP 连续画弧，只在明显背向路径时原地对齐。
      rotate_to_heading_min_angle: 0.85
      max_angular_accel: 1.0
      use_interpolation: true

velocity_smoother:
  ros__parameters:
    max_velocity: [0.27, 0.15, 0.45]
    min_velocity: [-0.27, -0.15, -0.45]
